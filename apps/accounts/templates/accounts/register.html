{% extends 'base.html' %}
{% load static %}

{% block title %}SentinelOps — Cadastro{% endblock %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'accounts/css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="auth-card card">
    <h1>Criar conta</h1>
    <p class="card__subtitle">Cadastre-se para acessar o SentinelOps.</p>

    <form method="post" class="form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn--primary">Cadastrar</button>
    </form>

    <p class="auth-card__alt">
        Já tem conta? <a href="{% url 'accounts:login' %}">Entrar</a>
    </p>
</div>
{% endblock %}
